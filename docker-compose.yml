services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/freshness.db
    volumes:
      - freshness-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/catalogs', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  freshness-data:
